name: family-vip-gallery
services:
- name: web
  source_dir: /
  github:
    repo: DxDyZ5/Family.exe
    branch: main
  build_command: |
    composer install --no-dev --optimize-autoloader
    php artisan config:cache
    php artisan route:cache
    php artisan view:cache
  run_command: |
    php artisan migrate --force
    php artisan db:seed --force
    php artisan storage:link
    php artisan serve --host=0.0.0.0 --port=8080
  environment_slug: php
  instance_count: 1
  instance_size_slug: basic-xxs
  envs:
  - key: APP_ENV
    value: production
  - key: APP_DEBUG
    value: "false"
  - key: APP_URL
    value: ${_self.URL}
  - key: DB_HOST
    value: ${db.HOSTNAME}
  - key: DB_PORT
    value: ${db.PORT}
  - key: DB_DATABASE
    value: ${db.DATABASE}
  - key: DB_USERNAME
    value: ${db.USERNAME}
  - key: DB_PASSWORD
    value: ${db.PASSWORD}
    type: secret
  - key: TELEGRAM_BOT_TOKEN
    value: "8572783983:AAHk6NkmX7gVcErIj9LAtpH79bKLAn5yXAQ"
  - key: TELEGRAM_ADMIN_CHAT_ID
    value: "5061353279"
  - key: SIGHTENGINE_USER
    value: "1992666454"
  - key: SIGHTENGINE_API_KEY
    value: "QPVkgVR9MY4udFUKrK4KLpBErqPEJYjk"
  - key: CACHE_DRIVER
    value: redis
  - key: SESSION_DRIVER
    value: redis
  - key: QUEUE_CONNECTION
    value: redis
  - key: REDIS_HOST
    value: ${redis.HOSTNAME}
  - key: REDIS_PORT
    value: ${redis.PORT}
  - key: REDIS_PASSWORD
    value: ${redis.PASSWORD}
    type: secret

databases:
- name: db
  engine: MYSQL
  version: "8"
  size: db-s-1vcpu-1gb
- name: redis
  engine: REDIS
  version: "7"
  size: db-s-1vcpu-1gb

workers:
- name: queue
  source_dir: /
  github:
    repo: DxDyZ5/Family.exe
    branch: main
  build_command: composer install --no-dev --optimize-autoloader
  run_command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
  environment_slug: php
  instance_count: 1
  instance_size_slug: basic-xxs
  envs:
  - key: APP_ENV
    value: production
  - key: DB_HOST
    value: ${db.HOSTNAME}
  - key: DB_PORT
    value: ${db.PORT}
  - key: DB_DATABASE
    value: ${db.DATABASE}
  - key: DB_USERNAME
    value: ${db.USERNAME}
  - key: DB_PASSWORD
    value: ${db.PASSWORD}
    type: secret
  - key: REDIS_HOST
    value: ${redis.HOSTNAME}
  - key: REDIS_PORT
    value: ${redis.PORT}
  - key: REDIS_PASSWORD
    value: ${redis.PASSWORD}
    type: secret
